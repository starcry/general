# Improve colors
set -g default-terminal 'screen-256color'

# Set scrollback buffer to 10000
set -g history-limit 10000

# Customize the status line
set -g status-fg  green
set -g status-bg  black

set -g visual-bell off
set -g bell-action any
set -g @tnotify-custom-cmd 'tmux display-message "⚡️ Task finished in #W:#P!" ; printf "\a"'

setw -g mouse on

bind-key C-Space run 'tmux-autocomplete'
set-option -g history-limit 100000

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Pane splits should open to the same path as the current pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# nvim magics
set-option -sg escape-time 10
set-option -g focus-events on
set-option -a terminal-features 'xterm-256color:RGB'

set-option -g default-command "bash --rcfile ~/.bashrc"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'rickstaa/tmux-notify'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Overlay custom bindings after TPM to ensure precedence
bind-key N command-prompt -p "Insert window at index:" "run-shell 'bash -ci \"source ~/.bashrc && tmux_insert_window %%\"'"

# Rename window to current directory name (<prefix> + r)
bind-key r rename-window '#{b:pane_current_path}'

# Popup Scratch Terminal (<prefix> + t)
bind t display-popup -E -d "#{pane_current_path}" -w 80% -h 80% "tmux new-session"

# Copy tmux buffer to system clipboard (matches 'tcp' alias)
bind y run-shell 'if [ "$(uname -s)" = "Darwin" ]; then tmux show-buffer | pbcopy; else tmux show-buffer | xclip -sel clip -i; fi'

# Persist: save & quit (<prefix> Q), restore (<prefix> Ctrl-r; prefer `trestore` from shell)
bind Q run-shell "bash ~/git/general/scripts/tmux_persist/save.sh"
bind C-r run-shell "bash ~/git/general/scripts/tmux_persist/restore.sh"

bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c '#{pane_current_path}'
